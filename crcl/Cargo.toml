[package]
name = "crcl"
version = "0.1.0"
edition = "2021"
description = "Rust types for CRCL (Canonical Robot Command Language) XML schemas"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-xml-rs = "0.8"
quick-xml = { version = "0.38", features = ["serialize"] }
