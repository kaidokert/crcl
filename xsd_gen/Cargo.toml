[package]
name = "xsd_gen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gen_data_primitives"
path = "src/main.rs"

[[bin]]
name = "gen_crcl_types"
path = "src/gen_crcl_types.rs"

[dependencies]
quick-xml = { version = "0.38.3", features = ["serialize"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.8.1"
xsd-parser = "1.3.0"
