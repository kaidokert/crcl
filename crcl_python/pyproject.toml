[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crcl-python"
version = "0.1.0"
description = "Python dataclasses for CRCL (Canonical Robot Command Language)"
readme = "../README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["CRCL", "robotics", "robot control", "XSD", "dataclasses"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "xsdata>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "mypy>=0.990",
]

[project.urls]
Homepage = "https://github.com/kaidokert/crcl"
Issues = "https://github.com/kaidokert/crcl/issues"
Repository = "https://github.com/kaidokert/crcl"

[tool.setuptools]
packages = ["crcl_python"]